spring.application.name=ms-cart
server.port=8084
server.servlet.context-path=/api

# === Postgres local (Docker) ===
spring.datasource.url=jdbc:postgresql://localhost:5433/milsaboresdb
spring.datasource.username=milsabores
spring.datasource.password=milsabores123
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.pool-name=ms-cart-pool
spring.datasource.hikari.connection-timeout=30000

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui


logging.level.org.springframework.jdbc.core=DEBUG
logging.level.com.milsabores=DEBUG

app.jwt.secret=mi-clave-super-secreta-para-hs256

